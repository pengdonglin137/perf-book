name: Build Chinese PDF

on:
  push:
    branches: [zh-cn]
  pull_request:
    branches: [zh-cn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install natsort
        pip install pandoc-fignos pandoc-tablenos

    - name: Install pandoc
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk

    - name: Build PDF
      run: |
        export PATH=/usr/bin:$PATH
        python3 export_book.py
        xelatex -interaction=nonstopmode book.tex
        mv book.pdf perf-book-zh.pdf
      timeout-minutes: 10

    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: perf-book-chinese
        path: perf-book-zh.pdf
        retention-days: 30
